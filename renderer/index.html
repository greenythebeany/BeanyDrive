<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BeanyDrive</title>
<script>
// Applied before the stylesheet paints so the window never flashes the wrong
// theme or style; renderer.js owns these attributes from then on.
(function () {
  try {
    var theme = localStorage.getItem('beanydrive_theme') || 'system';
    if (theme === 'system') {
      theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    var root = document.documentElement;
    root.dataset.theme = theme;
    root.dataset.ui = localStorage.getItem('beanydrive_ui') || 'nothing';
    root.dataset.density = localStorage.getItem('beanydrive_density') || 'comfortable';
    var accent = localStorage.getItem('beanydrive_accent_hex');
    if (accent) root.style.setProperty('--accent', accent);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <input type="file" id="file-input" multiple hidden />
  <div id="root" class="root"></div>
  <div id="preview-root"></div>

  <script src="ooxml.js"></script>
  <script src="renderer.js"></script>
</body>
</html>

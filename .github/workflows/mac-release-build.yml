name: macOS Release Build

# Builds the macOS disk images (Apple Silicon and Intel) with electron-builder
# on a macOS runner -- Mac builds can't be made on Windows or Linux. The app is
# ad-hoc signed (tools/mac-adhoc-sign.js), not notarized: there's no Apple
# Developer ID.
#
# Runs on pushes to release/** branches, or manually from the Actions tab,
# like the Android and Linux builds; if a GitHub release for this version
# exists, the .dmg files are attached to it. Pull requests that touch the
# desktop app build too, as a check -- those never upload anything.

on:
  workflow_dispatch:
  push:
    branches: ['release/**']
  pull_request:
    paths:
      - 'main.js'
      - 'preload.js'
      - 'renderer/**'
      - 'core/**'
      - 'update-checker.js'
      - 'package.json'
      - 'package-lock.json'
      - 'build/**'
      - 'tools/mac-adhoc-sign.js'
      - '.github/workflows/mac-release-build.yml'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build disk images
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never

      - name: Check the apps launch-ready
        run: |
          for app in dist/mac*/BeanyDrive.app; do
            codesign --verify --deep --strict "$app"
            lipo -archs "$app/Contents/MacOS/BeanyDrive"
          done

      - name: Collect version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BeanyDrive-${{ steps.ver.outputs.version }}-mac
          path: |
            dist/*.dmg
            dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

      - name: Attach to GitHub release (if one exists)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            FILES=(dist/*.dmg)
            [ -f dist/latest-mac.yml ] && FILES+=(dist/latest-mac.yml)
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            echo "No release $TAG yet -- the disk images are only in the run's artifacts."
          fi

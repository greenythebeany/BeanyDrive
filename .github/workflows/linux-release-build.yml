name: Linux Release Build

# Builds the Linux AppImage with electron-builder (target set under "linux"
# in package.json), as Triptych's workflow does. Runs on pushes to
# release/** branches, or manually from the Actions tab. If a draft/published
# GitHub release for this version exists, the AppImage is attached to it.

on:
  workflow_dispatch:
  push:
    branches: ['release/**']

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage
        run: npx electron-builder --linux --publish never

      - name: Collect version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BeanyDrive-${{ steps.ver.outputs.version }}-linux
          path: dist/*.AppImage
          retention-days: 14

      - name: Attach to GitHub release (if one exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.AppImage --clobber
          else
            echo "No release $TAG yet -- the AppImage is only in the run's artifacts."
          fi

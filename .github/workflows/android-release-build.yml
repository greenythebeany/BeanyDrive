name: Android Release Build

# Builds a signed release APK, the same way Triptych's workflow does. The
# signing key never lives in the repo -- it's restored from these repository
# secrets:
#   ANDROID_KEYSTORE_BASE64   base64 of the keystore file (.p12 or .jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# It must be the same key every release, or Android refuses to install the
# update over an existing copy.
#
# Unlike Triptych, mobile/android/ isn't committed (it's Capacitor's generated
# project), so this scaffolds it fresh each run, generates the launcher icons
# and splash from mobile/assets, stamps the version from mobile/package.json
# and wires the signing config in before Gradle runs.
#
# Runs on pushes to release/** branches, or manually from the Actions tab.
# If a draft/published GitHub release for this version exists, the APK is
# attached to it too.

on:
  workflow_dispatch:
  push:
    branches: ['release/**']
  # A debug build on pull requests that touch the Android side, so the native
  # plugin is known to compile before anything is released.
  pull_request:
    paths: ['mobile/**', 'renderer/**', 'core/**', 'platform/**']

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Create the Android project
        run: npx cap add android

      - name: Add the native plugin
        run: node native/install.mjs

      - name: Icons and splash
        run: |
          cp assets/icon.png assets/icon-only.png
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' \
            --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'

      - name: Debug build (pull requests)
        if: github.event_name == 'pull_request'
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Restore signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set -- see the comment at the top of this workflow."
            exit 1
          fi
          mkdir -p android/app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore/release.keystore
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/app/keystore/keystore.properties

      - name: Version and signing config
        if: github.event_name != 'pull_request'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CODE=$(node -p "const [a,b,c]=require('./package.json').version.split('.').map(Number); a*10000+b*100+c")
          # A second android {} block is merged into the generated one by Gradle.
          cat >> android/app/build.gradle <<EOF

          def bdKeystoreProps = new Properties()
          bdKeystoreProps.load(new FileInputStream(file('keystore/keystore.properties')))
          android {
              defaultConfig {
                  versionCode $CODE
                  versionName "$VERSION"
              }
              signingConfigs {
                  beanyRelease {
                      storeFile file('keystore/release.keystore')
                      storePassword bdKeystoreProps['storePassword']
                      keyAlias bdKeystoreProps['keyAlias']
                      keyPassword bdKeystoreProps['keyPassword']
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.beanyRelease
                  }
              }
          }
          EOF

      - name: Build release APK
        if: github.event_name != 'pull_request'
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Name APK by version
        if: github.event_name != 'pull_request'
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk "../BeanyDrive-$VERSION-android.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=BeanyDrive-$VERSION-android.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: BeanyDrive-${{ steps.apk.outputs.version }}-apk
          path: ${{ steps.apk.outputs.file }}
          retention-days: 14

      - name: Attach to GitHub release (if one exists)
        # Only release branches attach; a manual run of another branch must not
        # replace a published release's APK.
        if: startsWith(github.ref, 'refs/heads/release/')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.apk.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.apk.outputs.file }}" --clobber
          else
            echo "No release $TAG yet -- APK is only in the run's artifacts."
          fi
